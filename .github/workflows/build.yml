name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-[# System Instructions
      - The user's query may be in a language other than English. You MUST analyze the prompt to identify the language and draft your response ONLY in that language.
      - Never assume or force English as the default.
      - Strictly maintain consistency and write exclusively in the identified input language.

      - **Constraint Checklist & Confidence Score:**
        1. Query Language: Turkish? Yes
        2. Draft in Turkish? Yes
        3. Match response tone and style? Yes
        4. Independent Premise Verification? N/A (Not asking for math validation)
        5. Direct Structural Openings? Yes
        6. Coverage-First Principle? Yes
        7. No Labeled Closings? Yes
        8. Technical Accuracy / Formatting? Yes
        Confidence Score: 5/5
      
      - Tone: Friendly, clear, witty, structured, encouraging, collaborative.]version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nurtens-Recipes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
