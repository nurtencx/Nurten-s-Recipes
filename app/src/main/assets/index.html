<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nurten's Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 font-sans antialiased select-none">

    <!-- Top App Header -->
    <header class="bg-[#E11D48] text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xl font-black tracking-wider flex items-center gap-1.5">
                    <span class="text-[#F59E0B]">★</span> NURTEN'S RECIPES
                </h1>
                <p class="text-[10px] text-rose-100">Traditional Home Recipes & Calorie Tracking</p>
            </div>
            <div id="log-counter" class="bg-black/20 text-xs px-2.5 py-1 rounded-full border border-white/20">
                <span class="text-amber-300 font-bold" id="total-cal">0</span> kcal
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- TAB 1: RECIPES -->
        <section id="tab-recipes" class="space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Search recipes or ingredients..." 
                       class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-9 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-sm transition">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>

            <!-- Category Filters -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="category-pills">
                <button onclick="filterCategory('All')" class="cat-btn active bg-rose-600 text-white text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium shadow-sm">All (50)</button>
                <button onclick="filterCategory('Main Course')" class="cat-btn bg-white text-slate-600 text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium border border-slate-200">Main Course</button>
                <button onclick="filterCategory('Soups')" class="cat-btn bg-white text-slate-600 text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium border border-slate-200">Soups</button>
                <button onclick="filterCategory('Olive Oil Dishes')" class="cat-btn bg-white text-slate-600 text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium border border-slate-200">Olive Oil Dishes</button>
                <button onclick="filterCategory('Desserts')" class="cat-btn bg-white text-slate-600 text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium border border-slate-200">Desserts</button>
            </div>

            <!-- Recipe List -->
            <div id="recipe-list" class="space-y-3"></div>
        </section>

        <!-- TAB 2: PANTRY -->
        <section id="tab-pantry" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <h2 class="font-bold text-slate-800 text-sm mb-1">What's in My Pantry?</h2>
                <p class="text-xs text-slate-500 mb-3">Select the ingredients you have to see recipes you can make.</p>
                <div id="pantry-tags" class="flex flex-wrap gap-1.5"></div>
            </div>
            <div id="pantry-results" class="space-y-3"></div>
        </section>

        <!-- TAB 3: DAILY TRACKER -->
        <section id="tab-log" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-800 text-sm">Today's Total Intake</h2>
                    <p class="text-xs text-slate-400">Logged items</p>
                </div>
                <div class="text-right">
                    <span id="log-total-cal" class="text-2xl font-black text-rose-600">0</span>
                    <span class="text-xs text-slate-500">kcal</span>
                </div>
            </div>
            <div id="log-list" class="space-y-2"></div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40">
        <div class="flex justify-around max-w-md mx-auto py-2">
            <button onclick="switchTab('recipes')" id="nav-btn-recipes" class="flex flex-col items-center gap-1 text-rose-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                <span class="text-[10px] font-medium">Recipes</span>
            </button>
            <button onclick="switchTab('pantry')" id="nav-btn-pantry" class="flex flex-col items-center gap-1 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                <span class="text-[10px] font-medium">Pantry</span>
            </button>
            <button onclick="switchTab('log')" id="nav-btn-log" class="flex flex-col items-center gap-1 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span class="text-[10px] font-medium">Daily Log</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Data & Business Logic -->
    <script>
        const recipes = [
            { id: 1, name: "Lentil Soup", category: "Soups", cal: 180, ingredients: ["Red Lentil", "Onion", "Carrot", "Butter", "Salt", "Mint"] },
            { id: 2, name: "Stuffed Eggplant (Karniyarik)", category: "Main Course", cal: 380, ingredients: ["Eggplant", "Minced Meat", "Onion", "Tomato", "Pepper", "Garlic"] },
            { id: 3, name: "Olive Oil Stuffed Grape Leaves", category: "Olive Oil Dishes", cal: 290, ingredients: ["Grape Leaves", "Rice", "Onion", "Olive Oil", "Pine Nuts", "Currants"] },
            { id: 4, name: "Rice Pudding (Sutlac)", category: "Desserts", cal: 260, ingredients: ["Milk", "Rice", "Sugar", "Starch", "Vanilla"] },
            { id: 5, name: "Chicken Saute", category: "Main Course", cal: 320, ingredients: ["Chicken Breast", "Pepper", "Tomato", "Onion", "Olive Oil", "Thyme"] },
            { id: 6, name: "Ezogelin Soup", category: "Soups", cal: 210, ingredients: ["Red Lentil", "Bulgur", "Rice", "Tomato Paste", "Mint"] },
            { id: 7, name: "Mushroom Saute", category: "Olive Oil Dishes", cal: 150, ingredients: ["Mushroom", "Capia Pepper", "Onion", "Butter", "Black Pepper"] }
        ];

        let selectedCategory = 'All';
        let searchQuery = '';
        let selectedPantry = [];
        let dailyLog = [];

        function renderRecipes() {
            const list = document.getElementById('recipe-list');
            list.innerHTML = '';

            const filtered = recipes.filter(r => {
                const matchesCat = selectedCategory === 'All' || r.category === selectedCategory;
                const matchesSearch = r.name.toLowerCase().includes(searchQuery) || 
                                      r.ingredients.some(i => i.toLowerCase().includes(searchQuery));
                return matchesCat && matchesSearch;
            });

            filtered.forEach(r => {
                list.innerHTML += `
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="text-[9px] font-bold text-rose-500 uppercase tracking-wider">${r.category}</span>
                            <h3 class="font-bold text-slate-800 text-sm">${r.name}</h3>
                            <p class="text-[11px] text-slate-400 mt-0.5">${r.ingredients.join(', ')}</p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-1.5">
                            <span class="text-xs font-bold text-amber-500">${r.cal} kcal</span>
                            <button onclick="addLog(${r.id})" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white text-xs font-semibold px-2.5 py-1 rounded-lg transition">+ Eat</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat)) {
                    btn.className = "cat-btn active bg-rose-600 text-white text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium shadow-sm";
                } else {
                    btn.className = "cat-btn bg-white text-slate-600 text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium border border-slate-200";
                }
            });
            renderRecipes();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderRecipes();
        });

        function addLog(id) {
            const recipe = recipes.find(r => r.id === id);
            dailyLog.push(recipe);
            updateLogUI();
        }

        function updateLogUI() {
            const total = dailyLog.reduce((sum, item) => sum + item.cal, 0);
            document.getElementById('total-cal').innerText = total;
            document.getElementById('log-total-cal').innerText = total;

            const logList = document.getElementById('log-list');
            logList.innerHTML = '';
            dailyLog.forEach((item, index) => {
                logList.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                        <span class="font-medium text-slate-700">${item.name}</span>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-amber-500">${item.cal} kcal</span>
                            <button onclick="removeLog(${index})" class="text-slate-300 hover:text-rose-500 font-bold px-1">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function removeLog(index) {
            dailyLog.splice(index, 1);
            updateLogUI();
        }

        function switchTab(tab) {
            ['recipes', 'pantry', 'log'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-btn-${t}`).className = "flex flex-col items-center gap-1 text-slate-400";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-btn-${tab}`).className = "flex flex-col items-center gap-1 text-rose-600";
        }

        // Init
        renderRecipes();
    </script>
</body>
</html>
